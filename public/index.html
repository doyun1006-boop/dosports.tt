<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=10, user-scalable=yes, viewport-fit=cover" />
    <title>DO SPORTS 실시간 시간표</title>
    <link rel="stylesheet" href="/styles.css" />
  <style>#heroDescription{white-space:pre-line}#heroTitle{scroll-margin-top:24px}</style></head>
  <body class="viewer-page board-style-page">
    <div class="brand-watermark" aria-hidden="true"></div>

    <header class="schedule-header">
      <div class="schedule-brand">
        <h1 id="academyName">DO SPORTS 잠실점 시간표</h1>
        <p id="heroDescription">학부모님이 바로 확인할 수 있는 실시간 반별 시간표입니다.</p>
      </div>
      <div class="schedule-header-actions">
        <div class="status status-card compact-status">
          <span id="liveDot" class="dot"></span>
          <span id="lastUpdated">불러오는 중</span>
        </div>
      </div>
    </header>

    <main class="board-shell">
      <section class="connection-warning" id="connectionWarning" hidden></section>

      <section class="notice-bar" aria-label="공지사항">
        <strong>📢 공지</strong>
        <p id="notice">시간표는 수시로 변경될 수 있습니다. 장소와 정원 현황을 꼭 확인해 주세요.</p>
      </section>

      <section class="quick-link-row" id="quickLinkRow" aria-label="상담 및 신청 링크"></section>

      <section aria-label="우리 아이 수업 추천" style="margin:20px 0"><iframe id="recommendFrame" src="https://dosportstt.netlify.app/recommend.html" title="우리 아이에게 맞는 수업 추천" style="width:100%;height:1000px;border:0;border-radius:16px" loading="eager" allow="clipboard-write"></iframe></section>
<p style="font-size:14px;color:#42566e">참여가능은 직접 등·하원 기준입니다. 차량 이용 및 실제 등록은 상담 후 확정됩니다.</p>
<h2 id="heroTitle" class="schedule-main-title">농구 · 축구 · 키즈 수업을 한눈에 보는 시간표</h2>

      <nav class="category-tabs board-tabs" id="categoryTabs" aria-label="종목 선택"></nav>
      <section class="schedule-board" id="scheduleBoard" aria-live="polite"></section>
      <section class="empty" id="emptyState" hidden>
        등록된 수업이 없습니다. 관리자 화면에서 시간표를 추가해 주세요.
      </section>
    </main>

    <script src="/viewer.js"></script>
  <script>addEventListener("message",function(e){var f=document.getElementById("recommendFrame");if(f&&e.origin==="https://dosportstt.netlify.app"&&e.source===f.contentWindow&&e.data&&e.data.type==="dosports-recommend-height"&&Number.isFinite(e.data.height)){f.style.height=Math.max(400,Math.min(5000,e.data.height))+"px";}});</script></body>
</html>
